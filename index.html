<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="format-detection" content="telephone=no" />
  <title>妍妍的扭蛋机</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg-doodles" aria-hidden="true">
    <span class="doodle d1">✦</span>
    <span class="doodle d2">♡</span>
    <span class="doodle d3">✿</span>
    <span class="doodle d4">✦</span>
    <span class="doodle d5">♡</span>
    <span class="doodle d6">✿</span>
  </div>

  <!-- 隐藏调试栏（仅 ?debug=1 显示） -->
  <div id="debugBar" class="debug-bar" hidden>
    <span class="debug-label">测试</span>
    <button type="button" id="debugAddCoinBtn" class="debug-btn">加三枚币</button>
    <button type="button" id="debugResetBtn" class="debug-btn debug-btn-danger">重置</button>
  </div>

  <main class="app-shell">
    <header class="top-header">
      <div class="brand-badge">
        <span class="brand-pill">给妍妍</span>
        <h1 class="brand-title">妍妍的扭蛋机</h1>
      </div>
      <div class="top-actions">
        <button type="button" id="soundToggleBtn" class="icon-pill-btn" aria-label="开关音效">
          <span class="btn-emoji" id="soundIcon">🔊</span>
          <span class="btn-text" id="soundText">音效</span>
        </button>
        <button type="button" id="walletBtn" class="icon-pill-btn wallet-btn" aria-label="打开卡包">
          <span class="btn-emoji">🎟️</span>
          <span class="btn-text">卡包</span>
          <span id="walletCount" class="wallet-badge">0</span>
        </button>
      </div>
    </header>

    <section class="machine-stage" aria-label="扭蛋机">
      <div class="bear-topper" id="bearTopper">
        <div id="bearBubble" class="bear-bubble" aria-live="polite" hidden></div>
        <svg class="bear-svg" viewBox="0 0 220 96" role="img" aria-label="奶油小熊">
          <g class="bear-ear bear-ear-left" id="bearEarLeft" role="button" tabindex="0" aria-label="戳小熊左耳">
            <circle cx="58" cy="36" r="21" fill="#E8C39E" stroke="#5C4033" stroke-width="4" />
            <circle cx="58" cy="37" r="11" fill="#F8BBD0" />
          </g>
          <g class="bear-ear bear-ear-right" id="bearEarRight" role="button" tabindex="0" aria-label="戳小熊右耳">
            <circle cx="162" cy="36" r="21" fill="#E8C39E" stroke="#5C4033" stroke-width="4" />
            <circle cx="162" cy="37" r="11" fill="#F8BBD0" />
          </g>
          <ellipse cx="110" cy="60" rx="58" ry="42" fill="#F3D5B5" stroke="#5C4033" stroke-width="4" />
          <g class="bear-bow" transform="translate(148, 28) rotate(16)">
            <path d="M0 0 C-14 -12, -20 8, -2 6 Z" fill="#FF8DA1" stroke="#5C4033" stroke-width="3" stroke-linejoin="round" />
            <path d="M0 0 C14 -12, 20 8, 2 6 Z" fill="#FF8DA1" stroke="#5C4033" stroke-width="3" stroke-linejoin="round" />
            <circle cx="0" cy="3" r="5" fill="#FFE082" stroke="#5C4033" stroke-width="2.5" />
          </g>
          <ellipse class="bear-blush" cx="76" cy="66" rx="11" ry="6.5" fill="#FF9EBB" opacity="0.65" />
          <ellipse class="bear-blush" cx="144" cy="66" rx="11" ry="6.5" fill="#FF9EBB" opacity="0.65" />
          <circle cx="88" cy="54" r="4.8" fill="#5C4033" />
          <circle cx="86.5" cy="52.3" r="1.5" fill="#FFFFFF" />
          <circle cx="132" cy="54" r="4.8" fill="#5C4033" />
          <circle cx="130.5" cy="52.3" r="1.5" fill="#FFFFFF" />
          <ellipse cx="110" cy="68" rx="18" ry="13" fill="#FFF8F0" />
          <ellipse cx="110" cy="63" rx="6" ry="4.2" fill="#5C4033" />
          <path d="M104 71 Q110 77 116 71" fill="none" stroke="#5C4033" stroke-width="3" stroke-linecap="round" />
          <ellipse cx="62" cy="88" rx="16" ry="10" fill="#F3D5B5" stroke="#5C4033" stroke-width="4" />
          <ellipse cx="158" cy="88" rx="16" ry="10" fill="#F3D5B5" stroke="#5C4033" stroke-width="4" />
        </svg>
        <div id="bonusCoinDrop" class="bonus-coin-drop" hidden>✦</div>
      </div>

      <div class="machine-body" id="machineBody">
        <div class="dome-frame" id="domeFrame">
          <canvas id="capsuleCanvas" class="capsule-canvas" width="320" height="236"></canvas>
          <div class="dome-glass-shine" aria-hidden="true"></div>
        </div>

        <div class="machine-collar">
          <div class="collar-ribbon"></div>
          <div class="status-strip" id="statusStrip" aria-live="polite">投币，转一下</div>
        </div>

        <div class="machine-panel">
          <div class="coin-panel">
            <div class="panel-caption">投币口</div>
            <button type="button" id="coinSlotBtn" class="coin-slot" aria-label="投入一枚硬币">
              <span class="coin-slot-rim">
                <span class="coin-slot-slit"></span>
              </span>
              <span class="coin-slot-hint" id="coinSlotHint">投币</span>
            </button>
            <div class="coin-counter-box">
              <span class="coin-dot">币</span>
              <span>剩 <strong id="coinCount">5</strong> 枚</span>
            </div>
          </div>

          <div class="knob-panel">
            <div class="panel-caption">旋钮</div>
            <button type="button" id="knobBtn" class="knob-wheel" aria-label="转动旋钮" disabled>
              <span class="knob-petal p1"></span>
              <span class="knob-petal p2"></span>
              <span class="knob-petal p3"></span>
              <span class="knob-petal p4"></span>
              <span class="knob-core">
                <span class="knob-bar"></span>
                <span class="knob-center-dot"></span>
              </span>
            </button>
            <div class="knob-hint" id="knobHint">先投币</div>
          </div>
        </div>

        <div class="machine-base">
          <div class="dispenser-wrap">
            <div class="dispenser-label">出蛋口</div>
            <div class="dispenser-chute" id="dispenserChute">
              <div class="chute-flap" id="chuteFlap"></div>
              <button type="button" id="droppedCapsuleBtn" class="dropped-capsule" hidden aria-label="点击拆蛋">
                <span class="cap-top" id="droppedCapTop"></span>
                <span class="cap-band"></span>
                <span class="cap-bottom" id="droppedCapBottom"></span>
                <span class="cap-shine"></span>
                <span class="cap-tap-tip">点我拆开</span>
              </button>
              <span class="chute-empty-text" id="chuteEmptyText"></span>
            </div>
          </div>
        </div>

        <div class="machine-feet" aria-hidden="true">
          <span class="foot foot-left"></span>
          <span class="foot foot-right"></span>
        </div>
      </div>

      <div class="progress-card">
        <div class="progress-row">
          <span class="progress-label">进度</span>
          <span class="progress-value" id="progressText">0 / 5</span>
        </div>
        <div class="progress-dots" id="progressDots" aria-hidden="true"></div>
        <button type="button" id="wishShortcutBtn" class="wish-shortcut-btn" hidden>
          ✨ 打开隐藏心愿券
        </button>
      </div>
    </section>
  </main>

  <!-- 拆蛋过场 -->
  <div id="crackModal" class="modal-backdrop" hidden role="dialog" aria-modal="true" aria-label="拆蛋">
    <div class="crack-stage">
      <div class="crack-rays" aria-hidden="true"></div>
      <div class="crack-capsule" id="crackCapsule">
        <div class="crack-half crack-top" id="crackTop"></div>
        <div class="crack-half crack-bottom" id="crackBottom"></div>
      </div>
      <p class="crack-text" id="crackText">打开中……</p>
    </div>
  </div>

  <!-- 礼品券 / 撕票 / 回执 -->
  <div id="ticketModal" class="modal-backdrop" hidden role="dialog" aria-modal="true" aria-labelledby="ticketTitle">
    <div class="ticket-dialog">
      <button type="button" id="closeTicketBtn" class="modal-close-btn" aria-label="关闭">✕</button>

      <article id="ticketCard" class="ticket-card">
        <div class="ticket-top">
          <div class="ticket-meta-row">
            <span id="ticketRarity" class="rarity-tag">礼物</span>
            <span id="ticketSerial" class="ticket-serial">第 01 号</span>
          </div>

          <div id="ticketIllustration" class="ticket-illustration" aria-hidden="true"></div>

          <h2 id="ticketTitle" class="ticket-title">奶茶一杯</h2>
          <p id="ticketDesc" class="ticket-desc">想喝哪家，点给你</p>

          <!-- 仅心愿券显示 -->
          <div id="wishInputArea" class="wish-input-area" hidden>
            <div class="wish-input-row">
              <input id="wishInput" type="text" maxlength="50" placeholder="写下你想要的东西" />
              <button type="button" id="saveWishBtn" class="wish-save-btn">保存</button>
            </div>
            <p id="wishSavedNote" class="wish-saved-note" hidden></p>
          </div>

          <div id="redeemedStamp" class="redeemed-stamp" hidden aria-label="已兑现">
            <div class="stamp-ring">
              <span class="stamp-main">已兑现</span>
              <span class="stamp-sub">给妍妍</span>
            </div>
          </div>
        </div>

        <div class="ticket-perforation" aria-hidden="true">
          <span class="notch notch-left"></span>
          <span class="dash-line"></span>
          <span class="notch notch-right"></span>
        </div>

        <div id="tearZone" class="ticket-bottom tear-zone">
          <div id="tearTrack" class="tear-track">
            <div id="tearFill" class="tear-fill"></div>
            <span id="tearTrackText" class="tear-track-text">向右滑撕票 →</span>
            <div id="tearHandle" class="tear-handle" role="slider" tabindex="0" aria-label="向右滑撕票" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
              ✂️
            </div>
          </div>
        </div>

        <div id="receiptZone" class="ticket-bottom receipt-zone" hidden>
          <div class="receipt-grid">
            <div><span>时间</span><strong id="receiptTime"></strong></div>
            <div><span>持券人</span><strong>妍妍</strong></div>
          </div>
          <p class="receipt-tip">截屏发我，立刻买</p>
        </div>
      </article>

      <div class="ticket-footer-actions">
        <button type="button" id="keepTicketBtn" class="secondary-pill-btn">收进卡包</button>
      </div>
    </div>
  </div>

  <!-- 集满解锁 -->
  <div id="unlockModal" class="modal-backdrop" hidden role="dialog" aria-modal="true" aria-labelledby="unlockTitle">
    <div class="unlock-card">
      <div class="unlock-sparkles" aria-hidden="true">✨ 🎀 ✨</div>
      <h2 id="unlockTitle" class="unlock-title">解锁隐藏心愿券</h2>
      <p class="unlock-desc">五颗抽完啦，再送你一张空白心愿券，想要啥自己写。</p>
      <button type="button" id="openWishNowBtn" class="primary-pill-btn">去写心愿</button>
      <button type="button" id="closeUnlockBtn" class="text-link-btn">等会儿再看</button>
    </div>
  </div>

  <!-- 卡包 -->
  <div id="walletModal" class="modal-backdrop modal-sheet" hidden role="dialog" aria-modal="true" aria-labelledby="walletTitle">
    <div class="wallet-sheet">
      <div class="sheet-header">
        <h2 id="walletTitle" class="sheet-title">妍妍的卡包</h2>
        <button type="button" id="closeWalletBtn" class="modal-close-btn static-close" aria-label="关闭卡包">✕</button>
      </div>
      <div id="walletList" class="wallet-list"></div>
    </div>
  </div>

  <canvas id="confettiCanvas" class="confetti-canvas" aria-hidden="true"></canvas>

  <script src="sound.js"></script>
  <script src="physics.js"></script>
  <script src="app.js"></script>
</body>
</html>
